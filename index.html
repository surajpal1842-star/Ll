<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game UI Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: transparent;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* Floating UI Panel */
  #libPanel {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 280px;
    background: rgba(15, 15, 26, 0.92);
    border: 2px solid #00ffc8;
    border-radius: 14px;
    box-shadow: 0 0 20px rgba(0, 255, 200, 0.4),
                0 0 40px rgba(0, 255, 200, 0.15);
    color: #fff;
    z-index: 999999;
    user-select: none;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
    font-size: 14px;
  }

  #libPanel.minimized .panel-body { display: none; }
  #libPanel.minimized { width: 160px; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: linear-gradient(90deg, #00ffc8, #00b894);
    border-radius: 12px 12px 0 0;
    cursor: move;
    font-weight: bold;
    color: #000;
    font-size: 13px;
  }

  .panel-header .title {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 8px; height: 8px;
    background: #00ff88;
    border-radius: 50%;
    box-shadow: 0 0 8px #00ff88;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .panel-header button {
    background: rgba(0,0,0,0.3);
    border: none;
    color: #000;
    width: 22px; height: 22px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    line-height: 1;
  }

  .panel-header button:hover { background: rgba(0,0,0,0.5); }

  .panel-body {
    padding: 14px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: rgba(0, 255, 200, 0.08);
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 12px;
    border-left: 3px solid #00ffc8;
  }

  .status .icon {
    font-size: 14px;
  }

  .status.error { border-left-color: #ff4d4d; background: rgba(255,77,77,0.08); }
  .status.warn  { border-left-color: #ffb84d; background: rgba(255,184,77,0.08); }

  .btn {
    width: 100%;
    padding: 9px;
    margin-top: 6px;
    background: #00ffc8;
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }

  .btn:hover { background: #00cc9f; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn.secondary {
    background: transparent;
    color: #00ffc8;
    border: 1px solid #00ffc8;
  }

  .btn.secondary:hover { background: rgba(0,255,200,0.1); }

  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 4px 0;
    color: #aaa;
    border-bottom: 1px dashed rgba(255,255,255,0.08);
  }

  .info-row span:last-child { color: #00ffc8; font-weight: bold; }
</style>
</head>
<body>

<!-- ========== FLOATING UI PANEL ========== -->
<div id="libPanel">
  <div class="panel-header" id="panelHeader">
    <div class="title">
      <span class="dot"></span>
      <span>LIB LOADER</span>
    </div>
    <div>
      <button onclick="toggleMinimize()" title="Minimize">−</button>
    </div>
  </div>

  <div class="panel-body">
    <div class="status" id="statusBox">
      <span class="icon">⏳</span>
      <span id="statusText">Initializing...</span>
    </div>

    <div class="info-row"><span>Lib File</span><span id="libName">lib.so</span></div>
    <div class="info-row"><span>Status</span><span id="libState">Loading</span></div>
    <div class="info-row"><span>Version</span><span id="libVer">v1.0.0</span></div>
    <div class="info-row"><span>Engine</span><span id="engine">Detecting...</span></div>

    <button class="btn" onclick="reloadLib()">🔄 Reload Lib</button>
    <button class="btn secondary" onclick="hidePanel()">✖ Hide Panel</button>
  </div>
</div>

<!-- ========== SCRIPT ========== -->
<script>
(function () {
  "use strict";

  // ---------- Config ----------
  const LIB_URL = window.location.href; // jo bhi link game me daala wo
  const LIB_NAME = "lib.so";
  const LIB_VERSION = "v1.0.0";

  // ---------- Elements ----------
  const panel      = document.getElementById("libPanel");
  const statusBox  = document.getElementById("statusBox");
  const statusText = document.getElementById("statusText");
  const libNameEl  = document.getElementById("libName");
  const libState   = document.getElementById("libState");
  const libVerEl   = document.getElementById("libVer");
  const engineEl   = document.getElementById("engine");

  libNameEl.textContent = LIB_NAME;
  libVerEl.textContent  = LIB_VERSION;

  // ---------- Detect Engine ----------
  function detectEngine() {
    const ua = navigator.userAgent.toLowerCase();
    if (ua.includes("unity"))        return "Unity";
    if (ua.includes("godot"))        return "Godot";
    if (ua.includes("unreal"))       return "Unreal";
    if (typeof window.unityInstance !== "undefined") return "Unity";
    if (typeof window.godot !== "undefined")         return "Godot";
    if (window.WebAssembly)          return "Web (WASM)";
    return "Browser";
  }

  engineEl.textContent = detectEngine();

  // ---------- Set Status ----------
  function setStatus(msg, type) {
    statusText.textContent = msg;
    statusBox.className = "status" + (type ? " " + type : "");
    const icon = statusBox.querySelector(".icon");
    if (type === "error")      icon.textContent = "❌";
    else if (type === "warn")  icon.textContent = "⚠️";
    else                       icon.textContent = "✅";
  }

  // ---------- Try Load Lib (koshish karega, fail hone pe bhi UI rahega) ----------
  function tryLoadLib() {
    setStatus("Loading " + LIB_NAME + "...", null);
    libState.textContent = "Loading";

    // Fake loading simulation — chahe kuch na ho, UI toh dikhega
    setTimeout(() => {
      // .so browser me load nahi hoti, isliye gracefully fail karo
      setStatus("lib.so browser me support nahi (native lib)", "warn");
      libState.textContent = "Unsupported";
    }, 1200);

    // Agar future me kabhi WASM ya JS lib ho, ye try karega
    try {
      const script = document.createElement("script");
      script.src = LIB_URL;
      script.onload = () => {
        setStatus("Lib loaded successfully!", null);
        libState.textContent = "Loaded";
      };
      script.onerror = () => {
        // silently ignore — UI toh already dikh raha hai
      };
      // document.head.appendChild(script); // 👈 enable karo jab JS lib ho
    } catch (e) {
      console.warn("Lib load attempt failed:", e);
    }
  }

  // ---------- Reload ----------
  window.reloadLib = function () {
    tryLoadLib();
  };

  // ---------- Hide ----------
  window.hidePanel = function () {
    panel.style.display = "none";
  };

  // ---------- Minimize ----------
  window.toggleMinimize = function () {
    panel.classList.toggle("minimized");
  };

  // ---------- Drag Panel ----------
  let dragging = false, offsetX = 0, offsetY = 0;
  const header = document.getElementById("panelHeader");

  header.addEventListener("mousedown", (e) => {
    dragging = true;
    offsetX = e.clientX - panel.offsetLeft;
    offsetY = e.clientY - panel.offsetTop;
    header.style.cursor = "grabbing";
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    panel.style.left = (e.clientX - offsetX) + "px";
    panel.style.top  = (e.clientY - offsetY) + "px";
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
    header.style.cursor = "move";
  });

  // Touch support (mobile)
  header.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    dragging = true;
    offsetX = t.clientX - panel.offsetLeft;
    offsetY = t.clientY - panel.offsetTop;
  }, { passive: true });

  document.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    const t = e.touches[0];
    panel.style.left = (t.clientX - offsetX) + "px";
    panel.style.top  = (t.clientY - offsetY) + "px";
  }, { passive: true });

  document.addEventListener("touchend", () => { dragging = false; });

  // ---------- Start ----------
  tryLoadLib();

  console.log("[LibLoader] Panel active. URL:", LIB_URL);
})();
</script>
</body>
</html>
